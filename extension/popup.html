<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Chrome Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="brand">
          <img src="icons/icon48.png" alt="Claude Chrome Bridge" class="logo" />
          <div>
            <h1>Claude Chrome Bridge</h1>
            <p class="subtitle">Local MCP Browser Automation</p>
          </div>
        </div>
        <div id="status-pill" class="pill pill-off">
          <span id="status-dot" class="dot dot-off"></span>
          <span id="status-text">Disconnected</span>
        </div>
      </header>

      <section class="card">
        <div class="card-title">Bridge Connection</div>
        <form id="port-form" class="port-row">
          <label for="port-input" class="port-label">ws://127.0.0.1:</label>
          <input
            id="port-input"
            type="number"
            min="1"
            max="65535"
            value="18923"
            class="port-input"
          />
          <button type="submit" id="reconnect-btn" class="btn btn-primary">
            Reconnect
          </button>
        </form>
        <p id="error-note" class="error-note hidden"></p>
      </section>

      <section id="upload-card" class="card">
        <div class="card-title-row">
          <span class="card-title">Large-File Upload Engine</span>
          <span id="upload-badge" class="badge">Checking…</span>
        </div>
        <p id="upload-desc" class="card-desc"></p>
        <button id="open-settings-btn" type="button" class="btn btn-secondary hidden">
          Open Extension Settings
        </button>
      </section>

      <section class="card">
        <div class="card-title-row">
          <span class="card-title">Recent AI Actions</span>
          <span id="activity-count" class="muted">0</span>
        </div>
        <ul id="activity-list" class="activity-list"></ul>
        <p id="activity-empty" class="empty-state">No actions recorded yet.</p>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
